# Fetches the public-domain Webster's 1828 dictionary (a CSV transcription)
# with its licence and readme, and commits them to the webster1828-data branch.
name: Webster 1828 data
on:
  push:
    branches: [webster1828-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download
        run: |
          mkdir -p out && cd out
          ok=0
          for u in https://zff.dev/cobycat/webster1828/archive/main.tar.gz \
                   https://codeberg.org/akaitsurugi/webster1828/archive/main.tar.gz \
                   https://codeberg.org/cobycat/webster1828/archive/main.tar.gz; do
            if curl -fsSL "$u" -o w.tgz; then echo "::notice title=source::$u"; ok=1; break; fi
          done
          [ $ok = 1 ] || { echo "::error::no source reachable"; exit 1; }
          tar xzf w.tgz && rm w.tgz
          d=$(ls -d */ | head -1); cp -r "$d"/. . && rm -rf "$d"
          ls -la
          for f in *.csv LICENSE* README*; do [ -f "$f" ] && echo "::notice title=$f::$(wc -c < "$f") bytes"; done
          head -c 300 LICENSE* 2>/dev/null | tr '\n' ' ' | sed 's/^/::notice title=licence::/'; echo
      - name: Commit
        working-directory: out
        run: |
          git init -q -b webster1828-data
          git config user.name "data-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Webster 1828 transcription"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" webster1828-data
