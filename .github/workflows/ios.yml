# Builds the iOS app on GitHub's Macs and sends it to TestFlight.
# Run it from the Actions tab (Run workflow). Needs these repository secrets:
#   APPLE_TEAM_ID      your 10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID         App Store Connect API key ID
#   ASC_ISSUER_ID      App Store Connect issuer ID
#   ASC_KEY_P8         the contents of the downloaded AuthKey_XXXX.p8 file
#   IOS_CERT_PASSWORD  a long password you make up; it encrypts the signing key
# and, after the first successful run:
#   IOS_SIGNING_B64    the text of IOS_SIGNING_B64.txt from the run's
#                      "ios-signing" download (encrypted, safe to keep public)
name: iOS to TestFlight
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown in the App Store (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      unlock_all:
        description: 'Tester build: every feature unlocked (never goes to the public link)'
        type: boolean
        default: false
  # pushing a tag named tester-<anything> makes an unlocked tester build too
  push:
    tags: ['tester-*']
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ github.event.inputs.version || '1.0.0' }}
      UNLOCK_ALL: ${{ github.event.inputs.unlock_all == 'true' || startsWith(github.ref, 'refs/tags/tester-') }}
      # tester builds are numbered N.1; the public-link lane skips them
      BUILD_NUMBER: ${{ (github.event.inputs.unlock_all == 'true' || startsWith(github.ref, 'refs/tags/tester-')) && format('{0}.1', github.run_number) || github.run_number }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_SIGNING_B64: ${{ secrets.IOS_SIGNING_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Unlock everything (tester build only)
        if: env.UNLOCK_ALL == 'true'
        run: |
          echo 'window.SE_TESTER=1;' > www/assets/tester.js
          perl -0pi -e 's#<script src="assets/app.js"#<script src="assets/tester.js"></script><script src="assets/app.js"#' www/index.html
          grep -q 'assets/tester.js' www/index.html
          echo "Tester build $BUILD_NUMBER: all features unlocked" >> "$GITHUB_STEP_SUMMARY"
      - run: bash scripts/prepare.sh ios
      - run: gem install fastlane --no-document || sudo gem install fastlane --no-document
      - run: fastlane ios beta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-signing
          path: ios-signing/IOS_SIGNING_B64.txt
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-${{ github.run_number }}
          path: build/*.ipa
          if-no-files-found: ignore
